# Lab web application: static UI, generated manifest and status, and the terminal gateway (ttyd) on /tty/.
server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/lab-ui;
    index index.html;
    server_tokens off;

    location = /lab.json    { alias /run/lab/lab.json;    add_header Cache-Control "no-store"; default_type application/json; }
    location = /status.json { alias /run/lab/status.json; add_header Cache-Control "no-store"; default_type application/json; }

    # Lab-specific locations, e.g. a proxy to web apps inside the lab (lab folder: workstation/nginx/*.conf).
    include /opt/lab/nginx/*.conf;

    location /tty/ {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
