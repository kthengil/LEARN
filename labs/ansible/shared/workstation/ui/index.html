<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0f14'/%3E%3Cpath d='M8 11l5 5-5 5M15 22h9' fill='none' stroke='%23f59e0b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <button class="icon menu" id="menu" aria-label="Machines" aria-expanded="false">☰</button>
    <div class="brand"><span class="mark">›_</span><div><b id="lab-name">Lab</b><small id="lab-desc"></small></div></div>
    <div class="summary" id="summary" aria-live="polite"></div>
  </header>
  <div class="layout">
    <aside class="side" id="side" aria-label="Lab machines">
      <div id="machines"></div>
      <div id="links"></div>
      <p class="hint">Click a machine to open a terminal. Shift-click opens another one.</p>
    </aside>
    <main class="main">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Open terminals"></nav>
      <div class="panes" id="panes">
        <section class="welcome" id="welcome">
          <h1 id="welcome-title">Lab</h1>
          <p id="welcome-desc"></p>
          <div id="instructions" class="instructions"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
