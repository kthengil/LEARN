# Lets the browser show web pages served by the managed nodes: http://localhost:28201/web/node1/
resolver 127.0.0.11 valid=10s ipv6=off;
location ~ ^/web/(node[1-4])/(.*)$ {
    set $node $1;
    proxy_pass http://$node:80/$2$is_args$args;
    proxy_set_header Host $node;
    proxy_connect_timeout 3s;
}
