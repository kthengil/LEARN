# Prometheus configuration for the Observability lab. On the workstation this file is ~/prometheus/prometheus.yml;
# after a change, check it with `promtool check config` and reload with `curl -X POST http://prometheus:9090/-/reload`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
