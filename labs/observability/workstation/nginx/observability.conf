# Web UIs inside the lab: http://localhost:28207/grafana/, /prometheus/ and /alertmanager/.
# Grafana serves from its sub-path itself; Prometheus and Alertmanager get the prefix stripped here and know it
# through --web.external-url.
resolver 127.0.0.11 valid=10s ipv6=off;

location /grafana/ {
    set $grafana grafana:3000;
    proxy_pass http://$grafana;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 3s;
}

location /prometheus/ {
    set $prometheus prometheus:9090;
    rewrite ^/prometheus/(.*)$ /$1 break;
    proxy_pass http://$prometheus;
    proxy_set_header Host $http_host;
    proxy_connect_timeout 3s;
}

location /alertmanager/ {
    set $alertmanager alertmanager:9093;
    rewrite ^/alertmanager/(.*)$ /$1 break;
    proxy_pass http://$alertmanager;
    proxy_set_header Host $http_host;
    proxy_connect_timeout 3s;
}
